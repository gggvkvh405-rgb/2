services:
  - type: web
    name: byazen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: byazen-data
      mountPath: /var/data
      sizeGB: 1
